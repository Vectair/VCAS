name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/project-audit-review-4p0ft2
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp cache-busting build ID
        # index.html/manifest.json reference every local asset with a
        # ?v=__BUILD_ID__ query string. GitHub Pages doesn't let us set
        # custom Cache-Control headers, and browsers/WebViews cache JS/CSS
        # aggressively — without this, a normal reload after a deploy can
        # keep serving yesterday's code indefinitely. Substituting the real
        # commit SHA here means every deploy is a genuinely new URL for
        # every asset, so it can't come from a stale cache.
        #
        # src/app.js is in this list too (2026-09-01 fix, found from a real
        # reported bug): its own _registerServiceWorker() calls
        # navigator.serviceWorker.register("sw.js?v=__BUILD_ID__", ...) —
        # that placeholder was never getting substituted (this step only
        # covered index.html/manifest.json), so EVERY deploy registered the
        # exact same literal, never-changing scriptURL for the service
        # worker. A real service worker fix could ship, but browsers had no
        # forced signal that anything changed — the tab just kept running
        # whatever worker was already installed, sometimes indefinitely,
        # regardless of how many times the page itself was hard-refreshed
        # (a hard refresh bypasses the plain HTTP cache, it does NOT force
        # an already-controlling service worker to be replaced). Now that
        # app.js's own copy of the placeholder gets a real commit SHA too,
        # each deploy registers a genuinely different sw.js scriptURL, the
        # same reliable cache-busting every other asset already gets.
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" index.html manifest.json src/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Compiles Kotlin in-process (inside the main Gradle daemon's own JVM)
# instead of spawning a separate out-of-process Kotlin compile daemon
# (2026-08-24 — added after repeated real Kotlin-daemon crashes/RPC
# failures during the very first build on Windows: DaemonCrashedException,
# then a bare CompileService$CallResult$Error with no further detail).
# For a project this small (3 Kotlin files as of phase 1) the performance
# cost is negligible; sidestepping that whole class of daemon RPC failures
# is worth more here than the marginal speed of a separate daemon.
kotlin.compiler.execution.strategy=in-process
